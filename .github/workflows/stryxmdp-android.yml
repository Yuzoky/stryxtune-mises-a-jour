# Fabrique l'application Android StryxMDP (APK) et la publie dans la pré-version « stryxmdp ».
name: StryxMDP Android

on:
  push:
    paths:
      - 'stryxmdp/**'
      - 'android/**'
      - '.github/workflows/stryxmdp-android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stryxmdp-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # Clé de signature : fournie par les secrets du dépôt, jamais stockée dans le code.
      # Sans secret, une clé temporaire est créée (l'APK fonctionne, mais une future
      # mise à jour signée avec une autre clé demandera de désinstaller l'appli).
      - name: Préparer la clé de signature
        env:
          KEYSTORE_B64: ${{ secrets.STRYXMDP_KEYSTORE }}
          KEYSTORE_PASSWORD: ${{ secrets.STRYXMDP_KEYSTORE_PASSWORD }}
        run: |
          KS_FILE="$RUNNER_TEMP/release.jks"
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$KS_FILE"
            PASS="$KEYSTORE_PASSWORD"
          else
            echo "::warning::Secrets STRYXMDP_KEYSTORE / STRYXMDP_KEYSTORE_PASSWORD absents : clé temporaire utilisée."
            PASS="$(openssl rand -hex 24)"
            keytool -genkeypair -keystore "$KS_FILE" -storetype PKCS12 -alias stryxmdp \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$PASS" -keypass "$PASS" -dname "CN=StryxMDP"
          fi
          echo "::add-mask::$PASS"
          echo "KS_FILE=$KS_FILE" >> "$GITHUB_ENV"
          echo "KS_PASSWORD=$PASS" >> "$GITHUB_ENV"

      - name: Compiler l'APK
        run: gradle -p android assembleRelease -PversionCode=${{ github.run_number }} --no-daemon

      - name: Publier l'APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk StryxMDP.apk
          gh release delete stryxmdp --cleanup-tag --yes || true
          gh release create stryxmdp StryxMDP.apk \
            --prerelease \
            --target "${{ github.sha }}" \
            --title "StryxMDP (Android) 1.0.${{ github.run_number }}" \
            --notes "Application Android StryxMDP. Sur le téléphone : téléchargez **StryxMDP.apk** ci-dessous, ouvrez-le puis touchez **Installer** (autorisez l'installation d'applications inconnues si Android le demande)."

      - uses: actions/upload-artifact@v4
        with:
          name: StryxMDP-apk
          path: StryxMDP.apk
